[package]
name = "kubectl-config-doctor"
authors = ["Guilherme Oenning <goenning@aptakube.com>"]
description = "Kubectl plugin to validate kubeconfigs"
version = "0.3.7"
edition = "2021"
keywords = ["kubectl"]
license = "MIT"
homepage = "https://aptakube.com"
repository = "https://github.com/aptakube/kubectl-config-doctor"
readme = "README.md"
include = [
    "/Cargo.toml",
    "/LICENSE",
    "/README.md",
    "/src/**",
]

[[bin]]
name = "kubectl-config-doctor"
path = "src/main.rs"

[dependencies]
colored = "3.0.0"
home = "0.5.9"
http = "1.1.0"
k8s-openapi = { version = "=0.25.0", features = ["v1_30"] }
kube = { version = "1.1.0", features = ["config", "client", "rustls-tls", "aws-lc-rs", "socks5", "http-proxy", "oidc"] }
rustls = { version = "=0.23.22",  default-features = false, features = [] }
secrecy = "0.10.3"
tokio = { version = "=1.46.1", features = ["full"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true 
opt-level = 3
strip = true 
